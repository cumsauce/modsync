name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            zig: zig-aarch64-macos-0.17.0.tar.xz
          - os: ubuntu-latest
            zig: zig-x86_64-linux-0.17.0.tar.xz
          - os: windows-latest
            zig: zig-x86_64-windows-0.17.0.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (OpenGL/X11/Wayland for the wio backend)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev \
            libwayland-dev

      # Zig 0.17 renamed its release assets (arch before OS, e.g.
      # zig-aarch64-macos-0.17.0.tar.xz). Download straight from ziglang.org so
      # we don't depend on a mirror that lags new releases.
      - name: Install Zig (unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://ziglang.org/download/0.17.0/${{ matrix.zig }}" -o zig.tar.xz
          tar -xf zig.tar.xz
          ZIG_DIR="$(find . -maxdepth 1 -type d -name 'zig-*' | head -1)"
          echo "$PWD/$ZIG_DIR" >> "$GITHUB_PATH"

      - name: Install Zig (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://ziglang.org/download/0.17.0/${{ matrix.zig }}" -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath .
          $dir = (Get-ChildItem -Directory -Filter 'zig-*' | Select-Object -First 1).FullName
          echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Zig version
        run: zig version

      - name: Build
        run: zig build

      - name: Test
        # The unit tests use /tmp paths and are macOS-centric; run them on
        # macOS, and rely on the build (link) step as the gate elsewhere.
        if: runner.os == 'macOS'
        run: zig build test

  release:
    name: build (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
            asset: modsync-macos-arm64
            zig: zig-aarch64-macos-0.17.0.tar.xz
          - os: ubuntu-latest
            name: linux-x86_64
            asset: modsync-linux-x86_64
            zig: zig-x86_64-linux-0.17.0.tar.xz
          - os: windows-latest
            name: windows-x86_64
            asset: modsync-windows-x86_64.exe
            zig: zig-x86_64-windows-0.17.0.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (OpenGL/X11/Wayland for the wio backend)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev \
            libwayland-dev

      - name: Install Zig (unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://ziglang.org/download/0.17.0/${{ matrix.zig }}" -o zig.tar.xz
          tar -xf zig.tar.xz
          ZIG_DIR="$(find . -maxdepth 1 -type d -name 'zig-*' | head -1)"
          echo "$PWD/$ZIG_DIR" >> "$GITHUB_PATH"

      - name: Install Zig (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://ziglang.org/download/0.17.0/${{ matrix.zig }}" -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath .
          $dir = (Get-ChildItem -Directory -Filter 'zig-*' | Select-Object -First 1).FullName
          echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: cp zig-out/bin/modsync "${{ matrix.asset }}"

      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        run: copy zig-out\bin\modsync.exe "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "modsync ${GITHUB_REF_NAME}.

          Immediate-mode UI (dvui + wio) — no webview, no bundled browser engine.

          Download the asset for your platform:
          - macOS (Apple Silicon): modsync-macos-arm64
          - Linux (x86_64): modsync-linux-x86_64
          - Windows (x86_64): modsync-windows-x86_64.exe

          macOS note: the binary is unsigned, so Gatekeeper will warn on first launch.
          Either right-click the file and choose Open, or run:
          xattr -d com.apple.quarantine modsync-macos-arm64  (then chmod +x it).

          Linux/Windows assets are built and linked in CI but not runtime-tested."
