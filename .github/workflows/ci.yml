name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            zig: zig-aarch64-macos-0.17.0.tar.xz
          - os: ubuntu-latest
            zig: zig-x86_64-linux-0.17.0.tar.xz
          - os: windows-latest
            zig: zig-x86_64-windows-0.17.0.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # Zig 0.17 renamed its release assets (arch before OS, e.g.
      # zig-aarch64-macos-0.17.0.tar.xz). Download straight from ziglang.org so
      # we don't depend on a mirror that lags new releases.
      - name: Install Zig (unix)
        if: runner.os != 'Windows'
        run: |
          set -eux
          curl -fsSL "https://ziglang.org/download/0.17.0/${{ matrix.zig }}" -o zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version

      - name: Install Zig (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest "https://ziglang.org/download/0.17.0/${{ matrix.zig }}" -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath "$env:USERPROFILE\zig"
          $dir = (Get-ChildItem "$env:USERPROFILE\zig" -Directory | Select-Object -First 1).FullName
          echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dir\zig.exe" version

      - name: Install WebView2 SDK (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = '1.0.2903.40'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$ver/microsoft.web.webview2.$ver.nupkg" -OutFile wv2.nupkg
          Expand-Archive wv2.nupkg -DestinationPath wv2sdk
          echo "WEBVIEW2_INCLUDE=$PWD/wv2sdk/build/native/include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up MSVC (windows)
        # webview's WebView2 headers need the MSVC toolchain + Windows SDK; Zig's
        # default MinGW target can't consume them. This puts cl/link + the SDK on
        # PATH. We then compile webview to a static lib with cl and let Zig link
        # it, because Zig's bundled libc++ conflicts with MSVC's STL headers.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build webview static lib (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /c /std:c++17 /EHsc /DWEBVIEW_STATIC /Fo:webview.obj /I lib\webview /I "%WEBVIEW2_INCLUDE%" lib\webview\webview_impl.cc
          lib /nologo /OUT:webview.lib webview.obj

      - name: Zig version
        run: zig version

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            zig build -Dtarget=x86_64-windows-msvc -Dwebview-prebuilt-lib="$PWD/webview.lib"
          else
            zig build
          fi

      - name: Test
        # The unit tests use /tmp paths and are macOS-centric; run them on
        # macOS, and rely on the build (link) step as the gate elsewhere.
        if: runner.os == 'macOS'
        run: zig build test

  release:
    name: build (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
            asset: modsync-macos-arm64.tar.gz
            zig: zig-aarch64-macos-0.17.0.tar.xz
          - os: ubuntu-latest
            name: linux-x86_64
            asset: modsync-linux-x86_64.tar.gz
            zig: zig-x86_64-linux-0.17.0.tar.xz
          - os: windows-latest
            name: windows-x86_64
            asset: modsync-windows-x86_64.exe
            zig: zig-x86_64-windows-0.17.0.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Zig (unix)
        if: runner.os != 'Windows'
        run: |
          set -eux
          curl -fsSL "https://ziglang.org/download/0.17.0/${{ matrix.zig }}" -o zig.tar.xz
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version

      - name: Install Zig (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest "https://ziglang.org/download/0.17.0/${{ matrix.zig }}" -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath "$env:USERPROFILE\zig"
          $dir = (Get-ChildItem "$env:USERPROFILE\zig" -Directory | Select-Object -First 1).FullName
          echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dir\zig.exe" version

      - name: Install WebView2 SDK (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = '1.0.2903.40'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$ver/microsoft.web.webview2.$ver.nupkg" -OutFile wv2.nupkg
          Expand-Archive wv2.nupkg -DestinationPath wv2sdk
          echo "WEBVIEW2_INCLUDE=$PWD/wv2sdk/build/native/include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up MSVC (windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build webview static lib (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cl /nologo /c /std:c++17 /EHsc /DWEBVIEW_STATIC /Fo:webview.obj /I lib\webview /I "%WEBVIEW2_INCLUDE%" lib\webview\webview_impl.cc
          lib /nologo /OUT:webview.lib webview.obj

      - name: Build (ReleaseSafe)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-windows-msvc -Dwebview-prebuilt-lib="$PWD/webview.lib"
          else
            zig build -Doptimize=ReleaseSafe
          fi

      # Release assets are opaque blobs served over HTTPS: they carry no POSIX
      # permission bits, so a bare binary always downloads as 644 and every
      # user has to chmod +x it. tar stores the mode in its header, so
      # extraction hands back an already-executable file.
      # macOS ships as a .app bundle. A bare Mach-O handed to Finder is opened
      # by Terminal, which is the shell window users were seeing, and a bundle
      # is also the only way to carry the icon.
      - name: Stage artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          bash scripts/make-icon.sh build
          bash scripts/make-app.sh zig-out/bin/modsync "${GITHUB_REF_NAME#v}" dist
          tar -czf "${{ matrix.asset }}" -C dist modsync.app
          tar -tvzf "${{ matrix.asset }}"

      - name: Stage artifact (linux)
        if: runner.os == 'Linux'
        run: |
          test -x zig-out/bin/modsync
          tar -czf "${{ matrix.asset }}" -C zig-out/bin modsync
          tar -tvzf "${{ matrix.asset }}"

      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        run: copy zig-out\bin\modsync.exe "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "modsync ${GITHUB_REF_NAME}.

          Download the archive for your platform:
          - macOS (Apple Silicon): modsync-macos-arm64.tar.gz
          - Linux (x86_64): modsync-linux-x86_64.tar.gz
          - Windows (x86_64): modsync-windows-x86_64.exe

          macOS / Linux: extract and run.

          macOS ships as modsync.app, so it launches as a normal application
          with its own Dock icon -- no terminal window:

              tar -xzf modsync-macos-arm64.tar.gz
              mv modsync.app /Applications/
              open /Applications/modsync.app

          Linux ships a bare binary that is already executable:

              tar -xzf modsync-linux-x86_64.tar.gz
              ./modsync

          macOS note: the app is ad-hoc signed but not notarised, so Gatekeeper
          will warn on first launch. Either right-click it and choose Open, or
          clear the quarantine flag once:

              xattr -dr com.apple.quarantine /Applications/modsync.app

          Linux/Windows assets are built and linked in CI but not runtime-tested."
