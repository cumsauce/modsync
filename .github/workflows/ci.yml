name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0

      - name: Build
        run: zig build

      - name: Test
        # The unit tests use /tmp paths and are macOS-centric; run them on
        # macOS, and rely on the build (link) step as the gate elsewhere.
        if: runner.os == 'macOS'
        run: zig build test

  release:
    name: build (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
            asset: modsync-macos-arm64
          - os: ubuntu-latest
            name: linux-x86_64
            asset: modsync-linux-x86_64
          - os: windows-latest
            name: windows-x86_64
            asset: modsync-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Stage artifact (unix)
        if: runner.os != 'Windows'
        run: cp zig-out/bin/modsync "${{ matrix.asset }}"

      - name: Stage artifact (windows)
        if: runner.os == 'Windows'
        run: copy zig-out\bin\modsync.exe "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "modsync ${GITHUB_REF_NAME}.

          Download the asset for your platform:
          - macOS (Apple Silicon): \`modsync-macos-arm64\`
          - Linux (x86_64): \`modsync-linux-x86_64\`
          - Windows (x86_64): \`modsync-windows-x86_64.exe\`

          macOS note: the binary is unsigned, so Gatekeeper will warn on first launch.
          Either right-click the file and choose Open, or run:
          \`xattr -d com.apple.quarantine modsync-macos-arm64\` then \`chmod +x modsync-macos-arm64\`.

          Linux/Windows assets are built and linked in CI but not runtime-tested here."
