<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>modsync</title>
<script>
// Defined first and defensively: the Zig side evals
// `window.renderState && renderState({...})` during a refresh, which can fire
// before this page's main script has run. Buffer until the UI is ready.
window.renderState = function (state) {
  if (typeof state === "string") {
    try { state = JSON.parse(state); } catch (e) { return; }
  }
  if (typeof window.__applyState === "function") { window.__applyState(state); return; }
  window.__pendingState = state;
};
</script>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --fg: #1b1f24; --muted: #6b7280;
  --border: #e2e5ea; --accent: #2563eb; --accent-fg: #ffffff;
  --ok: #15803d; --warn: #b45309; --err: #b91c1c; --btn: #e8eaee;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171b; --card: #1d2126; --fg: #e7e9ee; --muted: #9299a5;
    --border: #2b3038; --accent: #3b82f6; --accent-fg: #ffffff;
    --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --btn: #2b3038;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
h1 { font-size: 18px; margin: 0 0 14px; }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px; margin-bottom: 14px;
}
.card h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); margin: 0 0 10px;
}
.row { display: flex; gap: 8px; align-items: center; }
input[type=text] {
  flex: 1; min-width: 0; padding: 7px 9px; border: 1px solid var(--border);
  border-radius: 7px; background: var(--bg); color: var(--fg); font: inherit;
}
input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button {
  padding: 7px 12px; border: 1px solid var(--border); border-radius: 7px;
  background: var(--btn); color: var(--fg); font: inherit; cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .6; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button.danger { color: var(--err); }
.hint { font-size: 12px; margin-top: 7px; min-height: 15px; color: var(--muted); }
.hint.ok { color: var(--ok); }
.hint.err { color: var(--err); }
.list { list-style: none; margin: 0; padding: 0; }
.list li {
  display: flex; gap: 10px; align-items: center;
  padding: 9px 0; border-top: 1px solid var(--border);
}
.list li:first-child { border-top: 0; }
.repo-name { font-weight: 600; flex: 1 1 auto; min-width: 90px; overflow-wrap: anywhere; }
.ver { color: var(--muted); font-size: 12px; flex: 0 1 auto; }
.status { font-size: 12px; flex: 0 1 180px; overflow-wrap: anywhere; }
.status.ok { color: var(--ok); }
.status.muted { color: var(--muted); }
.status.warn { color: var(--warn); }
.status.err { color: var(--err); }
.empty { color: var(--muted); padding: 10px 0; font-size: 13px; }
.launcher-kind {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--muted); padding-top: 10px; border-top: 0;
}
.launcher-label { flex: 1 1 auto; min-width: 90px; overflow-wrap: anywhere; }
.launcher-label.selected { color: var(--ok); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>modsync</h1>

  <section class="card">
    <div class="row" style="justify-content:space-between; margin-bottom:4px;">
      <h2>Detected launchers</h2>
      <button id="rescan">Rescan</button>
    </div>
    <ul id="launchers" class="list"></ul>
    <div id="launchers-empty" class="empty" hidden>No launchers found — enter a path below.</div>
    <div id="launchers-errors" class="hint"></div>
  </section>

  <section class="card">
    <h2>Minecraft folder</h2>
    <div class="row">
      <input id="folder" type="text" placeholder="/path/to/.minecraft" spellcheck="false">
      <button id="save" class="primary">Save</button>
    </div>
    <div id="folder-msg" class="hint"></div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between; margin-bottom:4px;">
      <h2 style="margin:0;">Tracked mods</h2>
      <div class="row" style="gap:8px;">
        <button id="restore">Restore defaults</button>
        <button id="refresh">Refresh all</button>
      </div>
    </div>
    <ul id="list" class="list"></ul>
    <div id="empty" class="empty" hidden>No mods tracked yet — add a repo below.</div>
  </section>

  <section class="card">
    <h2>Add repo</h2>
    <div class="row">
      <input id="new-repo" type="text" placeholder="owner/name" spellcheck="false">
      <button id="add" class="primary">Add</button>
    </div>
    <div id="add-msg" class="hint"></div>
  </section>
</main>
<script>
"use strict";
(async function () {
  const $ = (id) => document.getElementById(id);
  const folder = $("folder"), folderMsg = $("folder-msg");
  const list = $("list"), empty = $("empty");
  const refreshBtn = $("refresh");
  const newRepo = $("new-repo"), addMsg = $("add-msg");

  // All five bindings are globals injected by the webview glue; each returns
  // a Promise, so every call site awaits.
  async function call(name, ...args) {
    const fn = window[name];
    if (typeof fn !== "function") throw new Error(name + " not available");
    return await fn(...args);
  }
  // Zig's binds reply with the strings "true"/"false"; tolerate booleans too.
  function asBool(res) { return res !== "false" && res !== false; }

  let refreshing = false;
  function setRefreshing(on) {
    refreshing = on;
    refreshBtn.disabled = on;
    refreshBtn.textContent = on ? "Refreshing…" : "Refresh all";
  }

  function statusClass(repo) {
    const s = String(repo.status || "").toLowerCase();
    if (s.includes("error") || s.includes("fail")) return "err";
    if (s.includes("no release")) return "warn";
    if (repo.installedVersion) return "ok";
    return "muted";
  }

  function renderList(repos) {
    list.textContent = "";
    for (const repo of repos) {
      const li = document.createElement("li");

      const name = document.createElement("span");
      name.className = "repo-name";
      name.textContent = repo.owner + "/" + repo.name;

      const ver = document.createElement("span");
      ver.className = "ver";
      ver.textContent = repo.installedVersion || "not installed";

      const st = document.createElement("span");
      st.className = "status " + statusClass(repo);
      st.textContent = repo.status || "";

      const rm = document.createElement("button");
      rm.className = "danger";
      rm.textContent = "Remove";
      rm.addEventListener("click", async () => {
        rm.disabled = true;
        try { await call("removeRepo", repo.owner + "/" + repo.name); } catch (e) {}
        await load();  // re-fetch + re-render
      });

      li.append(name, ver, st, rm);
      list.appendChild(li);
    }
    empty.hidden = repos.length > 0;
  }

  // Single entry point for state: getConfig on load, renderState pushes during
  // a refresh, and re-fetches after add/remove. Also re-enables the refresh
  // button whenever a pushed state lands.
  window.__applyState = function (state) {
    setRefreshing(false);
    if (!state || typeof state !== "object") { renderList([]); return; }
    // Don't stomp the folder input while the user is typing in it.
    if (document.activeElement !== folder) folder.value = state.minecraftDir || "";
    currentGameDir = state.minecraftDir || "";
    renderList(Array.isArray(state.repos) ? state.repos : []);
    setRefreshing(false);
  };

  async function load() {
    let res;
    try { res = await call("getConfig"); } catch (e) { res = null; }
    // The Zig side returns the state as a JSON string; the glue may pass it
    // through as-is. Handle both shapes.
    if (typeof res === "string") { try { res = JSON.parse(res); } catch (e) { res = null; } }
    window.__applyState(res);  // null → empty state
  }

  // ---- Detected launchers -------------------------------------------------

  const launchersList = $("launchers");
  const launchersEmpty = $("launchers-empty");
  const launchersErrors = $("launchers-errors");
  let currentGameDir = "";

  function renderLaunchers(payload) {
    launchersList.textContent = "";
    const profiles = (payload && Array.isArray(payload.profiles)) ? payload.profiles : [];
    const errors = (payload && Array.isArray(payload.errors)) ? payload.errors : [];

    if (profiles.length === 0) {
      launchersEmpty.hidden = false;
    } else {
      launchersEmpty.hidden = true;
      let lastKind = null;
      for (const p of profiles) {
        if (p.kind !== lastKind) {
          lastKind = p.kind;
          const h = document.createElement("li");
          h.className = "launcher-kind";
          h.textContent = p.kind === "prism" ? "Prism Launcher" : "Modrinth App";
          launchersList.appendChild(h);
        }
        const li = document.createElement("li");
        li.className = "launcher-row";

        const label = document.createElement("span");
        label.className = "launcher-label" + (p.gameDir === currentGameDir ? " selected" : "");
        label.textContent = p.name + (p.gameDir === currentGameDir ? "  ✓" : "");
        label.title = p.gameDir;

        const use = document.createElement("button");
        use.textContent = "Use";
        use.addEventListener("click", async () => {
          let ok = false;
          try { ok = asBool(await call("selectProfile", p.gameDir)); } catch (e) {}
          if (ok) await load();  // re-fetch state (updates folder + selected row)
        });

        li.appendChild(label);
        li.appendChild(use);
        launchersList.appendChild(li);
      }
    }

    launchersErrors.textContent = errors.length
      ? "Couldn't read: " + errors.join(", ")
      : "";
  }

  async function loadLaunchers() {
    let payload = null;
    try { payload = await call("listLaunchers"); } catch (e) {}
    if (typeof payload === "string") { try { payload = JSON.parse(payload); } catch (e) { payload = null; } }
    renderLaunchers(payload);
  }

  $("rescan").addEventListener("click", () => loadLaunchers());

  $("restore").addEventListener("click", async () => {
    if (!confirm("Replace your tracked repos with the defaults file?")) return;
    let ok = false;
    try { ok = asBool(await call("restoreDefaults")); } catch (e) {}
    if (!ok) {
      addMsg.className = "hint err";
      addMsg.textContent = "Couldn't restore defaults.";
    }
    await load();  // re-fetch + re-render
  });

  // Flush a state push that arrived before this script ran.
  if (window.__pendingState) {
    window.__applyState(window.__pendingState);
    window.__pendingState = null;
  }

  $("save").addEventListener("click", async () => {
    folderMsg.className = "hint";
    folderMsg.textContent = "";
    let ok = false;
    try { ok = asBool(await call("setMinecraftDir", folder.value)); } catch (e) {}
    folderMsg.className = "hint " + (ok ? "ok" : "err");
    folderMsg.textContent = ok ? "Saved." : "Couldn't save folder.";
    if (ok) setTimeout(() => { folderMsg.textContent = ""; }, 2000);
  });

  refreshBtn.addEventListener("click", async () => {
    if (refreshing) return;
    setRefreshing(true);
    let started = false;
    try { started = asBool(await call("startRefresh")); } catch (e) {}
    if (!started) setRefreshing(false);  // already running or failed
    // On "true": stay disabled until a renderState call arrives.
  });

  $("add").addEventListener("click", async () => {
    const value = newRepo.value.trim();
    addMsg.className = "hint";
    addMsg.textContent = "";
    if (!value) {
      addMsg.className = "hint err";
      addMsg.textContent = "Enter owner/name.";
      return;
    }
    let ok = false;
    try { ok = asBool(await call("addRepo", value)); } catch (e) {}
    if (ok) {
      newRepo.value = "";
    } else {
      addMsg.className = "hint err";
      addMsg.textContent = "Couldn't add " + value + ".";
    }
    await load();  // re-fetch + re-render
  });
  newRepo.addEventListener("keydown", (e) => { if (e.key === "Enter") $("add").click(); });

  await load();
  await loadLaunchers();
})();
</script>
</body>
</html>
